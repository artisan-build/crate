name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single-entry matrix on purpose: production runs 8.5, so that is all CI tests.
        # Add 8.6 here when it reaches RC. Do not re-add 8.4 (nothing runs it).
        php-version: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit Dependencies
        run: composer audit --locked

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Rector
        run: composer rector:check

      - name: Run PHPStan
        run: composer stan

      - name: Run Tests
        run: ./vendor/bin/pest

      - name: Run Package Tests
        run: composer packages:check

  lowest-deps:
    name: tests (lowest deps) - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11'
            illuminate: 11.17.0
            testbench: ^9.0
            pest: ^3.0
            php: '8.4'
          - laravel: '12'
            illuminate: ^12.0
            testbench: ^10.0
            pest: ^3.0
            php: '8.5'
          - laravel: '13'
            illuminate: ^13.0
            testbench: ^11.0
            pest: ^4.0
            php: '8.5'

    defaults:
      run:
        working-directory: packages/crate-client

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Pin Laravel ${{ matrix.laravel }} dependencies
        run: >-
          composer require --no-update
          "illuminate/console:${{ matrix.illuminate }}"
          "illuminate/contracts:${{ matrix.illuminate }}"
          "illuminate/http:${{ matrix.illuminate }}"
          "illuminate/support:${{ matrix.illuminate }}"

      - name: Pin test dependencies
        run: >-
          composer require --dev --no-update
          "orchestra/testbench:${{ matrix.testbench }}"
          "pestphp/pest:${{ matrix.pest }}"

      - name: Allow intentional lowest dependency versions
        run: composer config audit.block-insecure false

      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-stable -W --no-interaction

      - name: Show resolved Laravel version
        run: composer show laravel/framework

      - name: Run package tests
        run: composer test
